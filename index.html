
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALCOMPÁS · Reproductor musical</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2ec;
      color: #333;
      text-align: center;
      padding: 30px 15px;
    }

    .player {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 25px;
      color: #34495e;
    }

    audio {
      width: 100%;
      margin: 25px 0;
    }

    .speeds {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .speeds button {
      padding: 10px 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 15px;
    }

    .speeds button.active {
      background: #34495e;
      color: white;
      border-color: #34495e;
    }

    p {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="player">
    <h1>ALCOMPÁS</h1>
    <p>Centro de Arte</p>

    <audio id="audio" controls>
      <source src="./Donatello-1.mp3" type="audio/mpeg">
      Tu navegador no admite audio.
    </audio>

    <p>Selecciona la velocidad:</p>

    <div class="speeds">
      <button data-speed="0.7">70%</button>
      <button data-speed="0.8">80%</button>
      <button data-speed="0.9">90%</button>
      <button data-speed="1" class="active">100%</button>
      <button data-speed="1.1">110%</button>
      <button data-speed="1.2">120%</button>
    </div>
  </div>

  <script type="module">
    const audio = document.getElementById("audio");
    const buttons = document.querySelectorAll(".speeds button");

    let audioContext;
    let soundTouchNode;
    let initialized = false;

    async function initializeAudio() {
      if (initialized) return;

      const { SoundTouchNode } = await import(
        "https://esm.sh/@soundtouchjs/audio-worklet@2.1.1"
      );

      audioContext = new AudioContext();

      await SoundTouchNode.register(
        audioContext,
        "./soundtouch-processor.js"
      );

      soundTouchNode = new SoundTouchNode({
        context: audioContext
      });

      audio.preservesPitch = false;

      const source = audioContext.createMediaElementSource(audio);
      source.connect(soundTouchNode);
      soundTouchNode.connect(audioContext.destination);

      initialized = true;
    }

    audio.addEventListener("play", async () => {
      try {
        await initializeAudio();
        await audioContext.resume();

        const activeButton = document.querySelector(
          ".speeds button.active"
        );

        const speed = Number(activeButton.dataset.speed);

        audio.playbackRate = speed;
        soundTouchNode.playbackRate.value = speed;
        soundTouchNode.pitch.value = 1;

      } catch (error) {
        console.error(error);
        alert("No se ha podido activar el procesamiento de audio. Comprueba tu conexión a Internet y vuelve a intentarlo.");
      }
    });

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const speed = Number(button.dataset.speed);

        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");

        if (initialized) {
          audio.playbackRate = speed;
          soundTouchNode.playbackRate.value = speed;
          soundTouchNode.pitch.value = 1;
        }
      });
    });
  </script>

</body>
</html>
