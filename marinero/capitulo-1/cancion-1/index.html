
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCOMPÁS · Canción 1</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3ef;
  color: #35443e;
  text-align: center;
  padding: 35px 15px;
}
main {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 30px 20px;
  border-radius: 20px;
}
h1 { letter-spacing: 3px; }
.subtitle { color: #78877e; }
audio { width: 100%; margin: 25px 0; }
.speeds {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  background: #e8eee9;
  color: #35443e;
  font-size: 15px;
  cursor: pointer;
}
button.active {
  background: #647b6d;
  color: white;
}
.back {
  display: inline-block;
  margin-top: 25px;
  color: #64776d;
}
#status {
  color: #78877e;
  font-size: 13px;
}
</style>
</head>

<body>
<main>
<h1>ALCOMPÁS</h1>
<p>Centro de Arte</p>
<h2>MARINERO</h2>
<p class="subtitle">Material de práctica musical</p>
<h3>Canción 1</h3>

<audio id="audio" controls>
  <source src="cancion-1.mp3" type="audio/mpeg">
  Tu navegador no puede reproducir este audio.
</audio>

<p>Velocidad de reproducción</p>

<div class="speeds">
  <button onclick="speed(0.7,this)">70%</button>
  <button onclick="speed(0.8,this)">80%</button>
  <button onclick="speed(0.9,this)">90%</button>
  <button class="active" onclick="speed(1,this)">100%</button>
  <button onclick="speed(1.1,this)">110%</button>
  <button onclick="speed(1.2,this)">120%</button>
</div>

<p id="status">Preparado para reproducir</p>

<a class="back" href="../">← Volver a las canciones</a>
</main>

<script type="module">
import { SoundTouchNode } from
"https://esm.sh/@soundtouchjs/audio-worklet@2.1.1";

const audio = document.getElementById("audio");
const status = document.getElementById("status");

let audioContext;
let soundTouchNode;
let sourceNode;
let ready = false;
let initializing = false;

async function initializeAudio() {
  if (ready) return;

  if (initializing) return;
  initializing = true;

  try {
    audioContext = new AudioContext();

    await audioContext.resume();

    await SoundTouchNode.register(
      audioContext,
      "../../../soundtouch-processor.js"
    );

    soundTouchNode = new SoundTouchNode({
      context: audioContext
    });

    sourceNode = audioContext.createMediaElementSource(audio);

    sourceNode.connect(soundTouchNode);
    soundTouchNode.connect(audioContext.destination);

    audio.preservesPitch = false;
    soundTouchNode.pitch.value = 1;

    ready = true;
    status.textContent = "Procesamiento de audio activado";

  } catch (error) {
    console.error(error);

    if (sourceNode) {
      sourceNode.disconnect();
      sourceNode.connect(audioContext.destination);
      audio.preservesPitch = true;
    }

    status.textContent =
      "No se pudo activar el procesamiento. Se intentará la reproducción normal.";

    ready = false;
  } finally {
    initializing = false;
  }
}

audio.addEventListener("play", async () => {
  if (!ready) {
    audio.pause();
    await initializeAudio();

    if (ready) {
      audio.play();
    } else if (sourceNode) {
      audio.play();
    }
  } else if (audioContext.state === "suspended") {
    await audioContext.resume();
  }
});

window.speed = function(value, button) {
  audio.playbackRate = value;

  if (soundTouchNode && ready) {
    soundTouchNode.playbackRate.value = value;
  }

  document.querySelectorAll(".speeds button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
};
</script>
</body>
</html>
