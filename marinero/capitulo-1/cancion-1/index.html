
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCOMPÁS · Canción 1</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3ef;
  color: #35443e;
  text-align: center;
  padding: 35px 15px;
}
main {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 30px 20px;
  border-radius: 20px;
}
h1 { letter-spacing: 3px; }
.subtitle { color: #78877e; }
audio { width: 100%; margin: 25px 0; }
.speeds {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  background: #e8eee9;
  color: #35443e;
  font-size: 15px;
  cursor: pointer;
}
button.active {
  background: #647b6d;
  color: white;
}
.back {
  display: inline-block;
  margin-top: 25px;
  color: #64776d;
}
</style>
</head>
<body>
<main>
<h1>ALCOMPÁS</h1>
<p>Centro de Arte</p>
<h2>MARINERO</h2>
<p class="subtitle">Material de práctica musical</p>
<h3>Canción 1</h3>

<audio id="audio" controls preload="auto">
  <source src="cancion-1.mp3" type="audio/mpeg">
  Tu navegador no puede reproducir este audio.
</audio>

<p>Velocidad de reproducción</p>
<div class="speeds">
  <button onclick="speed(0.7,this)">70%</button>
  <button onclick="speed(0.8,this)">80%</button>
  <button onclick="speed(0.9,this)">90%</button>
  <button class="active" onclick="speed(1,this)">100%</button>
  <button onclick="speed(1.1,this)">110%</button>
  <button onclick="speed(1.2,this)">120%</button>
</div>

<a class="back" href="../">← Volver a las canciones</a>
</main>

<script>
const audio = document.getElementById("audio");

let audioContext;
let source;
let processor;
let workletReady = false;
let setupPromise = null;
let currentSpeed = 1;

async function setupSoundTouch() {
  audioContext = new AudioContext();
  source = audioContext.createMediaElementSource(audio);

  try {
    await audioContext.audioWorklet.addModule(
      "../../../soundtouch-processor.js"
    );

    processor = new AudioWorkletNode(
      audioContext,
      "soundtouch-processor",
      {
        numberOfInputs: 1,
        numberOfOutputs: 1,
        outputChannelCount: [2],
        channelCount: 2,
        channelCountMode: "max"
      }
    );

    source.connect(processor);
    processor.connect(audioContext.destination);

    workletReady = true;
    audio.playbackRate = 1;
    applySpeed(currentSpeed);

  } catch (error) {
    source.connect(audioContext.destination);
    audio.playbackRate = currentSpeed;
  }

  await audioContext.resume();
}

audio.addEventListener("play", async () => {
  if (workletReady) {
    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }
    return;
  }

  if (setupPromise) {
    await setupPromise;
    return;
  }

  audio.pause();

  setupPromise = (async () => {
    try {
      await setupSoundTouch();
    } catch (error) {
      console.error("SoundTouch:", error);
      if (source && audioContext) {
        try {
          source.connect(audioContext.destination);
        } catch (e) {}
      }
      audio.playbackRate = currentSpeed;
    }

    audio.play();
  })();

  await setupPromise;
});

function applySpeed(value) {
  if (workletReady && processor) {
    const parameter = processor.parameters.get("playbackRate");

    if (parameter) {
      parameter.setValueAtTime(value, audioContext.currentTime);
    }
  } else {
    audio.playbackRate = value;
  }
}

function speed(value, button) {
  currentSpeed = value;
  applySpeed(value);

  document.querySelectorAll(".speeds button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
}
</script>
</body>
</html>
